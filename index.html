<script>
/* Режим установленного приложения (app-native): standalone-режим PWA,
   сервер (atl-server=1) или публичная сборка Pages (atl-server=pub) —
   в них узкое окно даёт app-native. На статике checks.py (0) не меняется. */
(function () {
  var st = document.querySelector('meta[name="atl-server"]');
  var on = !!(st && (st.content === '1' || st.content === 'pub'));
  function upd() {
    var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var narrow = on && window.innerWidth <= 520;
    document.documentElement.classList.toggle('app-native', standalone || narrow);
  }
  upd();
  window.addEventListener('resize', upd);
  window.addEventListener('orientationchange', function () { setTimeout(upd, 50); });
  try {
    var mq = window.matchMedia('(display-mode: standalone)');
    if (mq.addEventListener) mq.addEventListener('change', upd);
  } catch (e) {}
})();
</script>

<script>
  /* подгонка рамки рабочего стола под доступное место */
  function fitDesk() {
    var f = document.querySelector('.frame.desk');
    if (!f) return;
    var stage = f.closest('.stage');
    if (!stage) return;
    var s = Math.min(1, (stage.clientWidth - 40) / 1440, (stage.clientHeight - 60) / 900);
    f.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitDesk);
  new MutationObserver(fitDesk).observe(document.getElementById('app'), { childList: true, subtree: false });
</script>
